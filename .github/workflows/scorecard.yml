# OSSF Scorecard supply-chain security scan.
#
# Documented in SECURITY.md and required as a branch-protection status
# check (.github/branch-protection.md) under its exact job name below
# ("Scorecard supply-chain security / Scorecard analysis" — do not
# rename the workflow or job without updating both of those).
#
# Triggers: PRs to develop (catches a regression before merge),
# branch_protection_rule changes (OSSF's own recommendation — Scorecard
# scores branch protection itself, so a protection-rule edit should
# re-score), and a weekly schedule (catches drift in third-party
# dependencies' own scores between PRs).
#
# actions/* pinned to SHA, matching the pins already used in
# vulnerability-scan.yml for the same three actions.

name: Scorecard supply-chain security

on:
  pull_request:
    branches: [develop]
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires the repo to be public; opencost-ai is,
          # so results feed the public Scorecard dataset. Flip to
          # false if this chart is ever mirrored into a private fork.
          publish_results: true

      - name: Upload SARIF as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 7

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: results.sarif
