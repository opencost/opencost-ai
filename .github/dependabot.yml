version: 2
updates:
  # Dependencies listed in go.mod
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Dependencies listed in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in Dockerfile. RUNTIME_IMAGE is digest-pinned
  # specifically so Dependabot has something concrete to bump here —
  # an unpinned "latest"/floating tag gives it nothing to open a PR
  # against.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
